name: Generate SEC-SQL-HARDENING-003

on:
  push:
    branches:
      - security/final-audit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/final-audit

      - name: Detect existing migration
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G "supabase/migrations/*_sec_sql_hardening_003_cron_rpc_acl.sql" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate migration filename with Supabase CLI
        if: steps.guard.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest --version
          npx --yes supabase@latest migration new sec_sql_hardening_003_cron_rpc_acl

      - name: Populate exact ACL mutation
        if: steps.guard.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          M="$(find supabase/migrations -maxdepth 1 -type f -name '*_sec_sql_hardening_003_cron_rpc_acl.sql' | sort | tail -n 1)"
          test -n "$M"
          cat > "$M" <<'SQL'
          revoke execute on function public.sync_revision_overdue_reports()
            from public, anon, authenticated;
          SQL
          grep -qx 'revoke execute on function public.sync_revision_overdue_reports()' <(head -n 1 "$M")

      - name: Commit migration
        if: steps.guard.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "chore: add SEC-SQL-HARDENING-003 migration"
          git push origin HEAD:security/final-audit
