name: MAINT-CLEANUP-002 Full Source Bootstrap

on:
  push:
    branches:
      - maint/cleanup-002-full-source
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cleanup-002-full-source
  cancel-in-progress: false

jobs:
  restore-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify bootstrap payload
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "maint/cleanup-002-full-source"
          test -f .bootstrap/cleanup002/payload.tar.xz
          echo "358f15714e167078c0e0db35c0e01e2e44641e8780cc8f2716fb2fcca406a516  .bootstrap/cleanup002/payload.tar.xz" | sha256sum -c -

      - name: Restore full source directories
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf .bootstrap/cleanup002/payload.tar.xz -C .
          for dir in tests scripts database supabase docs; do
            test -d "$dir"
          done

      - name: Verify runtime frontend is untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD --             src public index.html vite.config.ts package.json package-lock.json             .github/workflows/deploy-pages.yml

      - name: Verify package-script source paths
        shell: bash
        run: |
          set -euo pipefail
          required=(
            scripts/package-edge-functions.mjs
            scripts/verify-release.mjs
            scripts/run-quality-gate.mjs
            scripts/package-audit-hotfix.mjs
            scripts/package-github-pages-minimal.mjs
            tests/maint-cleanup.test.mjs
            tests/immediate-watcher-tdz.test.mjs
            tests/v9-banner-artwork-regression.test.mjs
            tests/unit
            tests/homework
            tests/bug-001
            tests/feat-002
            tests/feat-003
            tests/feat-004
          )
          for path in "${required[@]}"; do
            test -e "$path" || { echo "::error::Missing package-script target: $path"; exit 1; }
          done

      - name: Verify reconciled migration source
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat <<'EOF'
          20260815085954_v8301_rls_login_fix.sql
          20260831075330_grant_authenticated_avatar_path_select.sql
          20260831162435_allow_animated_gif_avatars.sql
          20260831162906_revoke_anon_avatar_rpc_execute.sql
          20260831170455_avatar_visibility_by_class_relationship.sql
          20260921060255_verify002_add_device_use_policy_signals_realtime.sql
          20260921060825_verify002_device_slot_key_search_path.sql
          20260923114552_storage_change_signals.sql
          EOF
          )"
          actual="$(find supabase/migrations -maxdepth 1 -type f -printf '%f\n' | sort)"
          test "$actual" = "$expected" || {
            echo "::error::Migration source does not match the reconciled 8-version baseline."
            echo "Expected:"; printf '%s\n' "$expected"
            echo "Actual:"; printf '%s\n' "$actual"
            exit 1
          }

      - name: Reject generated secrets/config
        shell: bash
        run: |
          set -euo pipefail
          if find tests scripts database supabase docs -type f \( -name '.env' -o -name '.env.*' -o -name 'config.js' \) -print -quit | grep -q .; then
            echo "::error::Generated config/secret-like file found in restored source."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cleanup-specific regression
        run: node --test tests/maint-cleanup.test.mjs

      - name: Static regression suite
        run: npm run test:static

      - name: VERIFY-002 regression
        run: node --test tests/verify-002/*.test.mjs

      - name: Targeted legacy regressions
        run: node --test tests/immediate-watcher-tdz.test.mjs tests/v9-banner-artwork-regression.test.mjs

      - name: FEAT-009 mascot tests
        run: |
          npx vitest run --config tests/feat-009/vitest.config.ts
          npx vitest run tests/unit/owl-mascot-v2.test.ts

      - name: FEAT-010 UI regression
        run: npx vitest run --config tests/feat-010/vitest.config.ts

      - name: FEAT-012 storage live regression
        run: |
          node --test tests/admin-live-v2/signals.test.mjs
          npx vitest run --config tests/admin-live-v2/vitest.config.ts
          npx vitest run --config tests/feat-008/vitest.config.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Generate temporary browser Supabase config
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          LOGIN_DOMAIN: ${{ vars.LOGIN_DOMAIN }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const projectUrl = String(process.env.SUPABASE_PROJECT_URL || '').trim()
          const publishableKey = String(process.env.SUPABASE_PUBLISHABLE_KEY || '').trim()
          const loginDomain = String(process.env.LOGIN_DOMAIN || 'users.example.com').trim()
          if (!projectUrl || !publishableKey) throw new Error('Missing browser Supabase config')
          fs.writeFileSync('public/config.js',
            'window.APP_CONFIG = ' + JSON.stringify({
              mode: 'supabase',
              projectUrl: projectUrl.replace(/\/$/, ''),
              publishableKey,
              loginDomain: loginDomain || 'users.example.com',
              fallbackRefreshSeconds: 180,
            }, null, 2) + ';\n'
          )
          NODE

      - name: Build GitHub Pages bundle
        env:
          VITE_OWL_MASCOT_V2_ENABLED: 'true'
        run: npm run build:pages

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start built site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 -d dist > /tmp/cleanup002-http.log 2>&1 &
          echo $! > /tmp/cleanup002-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cleanup002-http.log
          exit 1

      - name: Chromium blank-page smoke
        shell: bash
        run: |
          cat > /tmp/cleanup002-smoke.mjs <<'NODE'
          import { chromium } from '@playwright/test'
          const browser = await chromium.launch({headless:true})
          const page = await browser.newPage()
          const pageErrors = []
          const failedRequests = []
          page.on('pageerror', e => pageErrors.push(String(e?.stack || e)))
          page.on('requestfailed', r => failedRequests.push({url:r.url(),error:r.failure()?.errorText || 'unknown'}))
          const response = await page.goto('http://127.0.0.1:4173/', {waitUntil:'domcontentloaded',timeout:30000})
          await page.waitForTimeout(2500)
          const appHtml = await page.locator('#app').innerHTML().catch(()=> '')
          const loginVisible = await page.locator('.login-shell').count() > 0
          const report = {status:response?.status() ?? null,appHtmlLength:appHtml.length,loginVisible,pageErrors,failedRequests}
          console.log(JSON.stringify(report,null,2))
          await page.screenshot({path:'/tmp/cleanup002-smoke.png',fullPage:true})
          await browser.close()
          if (!response || response.status() >= 400 || !appHtml.trim() || !loginVisible || pageErrors.length) process.exit(1)
          NODE
          node /tmp/cleanup002-smoke.mjs

      - name: Remove generated/build-only files
        if: always()
        shell: bash
        run: |
          rm -f public/config.js
          rm -rf dist

      - name: Verify final source diff scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD --             src public index.html vite.config.ts package.json package-lock.json             .github/workflows/deploy-pages.yml
          test ! -e public/config.js
          test ! -e dist

      - name: Commit restored source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap/cleanup002
          rm -f .github/workflows/cleanup-002-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests scripts database supabase docs
          git add -u .bootstrap .github/workflows/cleanup-002-bootstrap.yml || true

          echo "Changed paths before commit:"
          git status --short

          unexpected="$(git diff --cached --name-only | grep -Ev '^(tests/|scripts/|database/|supabase/|docs/|\.bootstrap/|\.github/workflows/cleanup-002-bootstrap\.yml$)' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected staged paths:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          git commit -m "chore: restore complete project source and test history"
          git push origin HEAD:maint/cleanup-002-full-source
