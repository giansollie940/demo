name: SEC-SQL-HISTORY-001 Generate Migrations

on:
  push:
    branches:
      - sec/sql-history-001

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: sec/sql-history-001

      - name: Stop if migrations already exist
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G "supabase/migrations/*_sec_sql_hardening_001_trigger_acl.sql" >/dev/null &&
             compgen -G "supabase/migrations/*_sec_sql_hardening_002_anon_helpers.sql" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate migration files with Supabase CLI
        if: steps.guard.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest --version
          npx --yes supabase@latest migration new sec_sql_hardening_001_trigger_acl
          sleep 2
          npx --yes supabase@latest migration new sec_sql_hardening_002_anon_helpers

      - name: Populate exact migration SQL
        if: steps.guard.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          A="$(find supabase/migrations -maxdepth 1 -type f -name '*_sec_sql_hardening_001_trigger_acl.sql' | sort | tail -n 1)"
          B="$(find supabase/migrations -maxdepth 1 -type f -name '*_sec_sql_hardening_002_anon_helpers.sql' | sort | tail -n 1)"
          test -n "$A" && test -n "$B"

          cat > "$A" <<'SQL'
          revoke execute on function public.capture_ai_teacher_feedback()
            from public, anon, authenticated;
          revoke execute on function public.guard_class_deactivation_with_active_learners()
            from public, anon, authenticated;
          revoke execute on function public.guard_root_admin_profile()
            from public, anon, authenticated;
          revoke execute on function public.guard_student_registration_update()
            from public, anon, authenticated;
          revoke execute on function public.set_registration_class_id()
            from public, anon, authenticated;
          revoke execute on function public.sync_class_assignments_on_deactivate()
            from public, anon, authenticated;
          revoke execute on function public.sync_teacher_assignments_on_profile_change()
            from public, anon, authenticated;
          revoke execute on function public.sync_week_statuses_after_calendar_change()
            from public, anon, authenticated;
          revoke execute on function public.validate_class_teacher_assignment()
            from public, anon, authenticated;
          revoke execute on function public.validate_class_week_school_year()
            from public, anon, authenticated;
          revoke execute on function public.validate_profile_class_scope()
            from public, anon, authenticated;
          revoke execute on function public.validate_registration_class_week()
            from public, anon, authenticated;
          revoke execute on function public.validate_week_override_school_year()
            from public, anon, authenticated;
          SQL

          cat > "$B" <<'SQL'
          revoke execute on function public.ai_automation_is_enabled(uuid)
            from public, anon;
          revoke execute on function public.can_manage_class(uuid)
            from public, anon;
          revoke execute on function public.can_manage_registration(uuid)
            from public, anon;
          revoke execute on function public.can_manage_student(uuid)
            from public, anon;
          revoke execute on function public.can_view_registration(uuid)
            from public, anon;
          revoke execute on function public.class_week_effective_status(uuid, uuid)
            from public, anon;
          revoke execute on function public.current_student_class_id()
            from public, anon;
          revoke execute on function public.get_ai_feedback_memory_stats()
            from public, anon;
          revoke execute on function public.is_active_teacher()
            from public, anon;
          revoke execute on function public.is_root_admin()
            from public, anon;
          revoke execute on function public.registration_deadline_for_slot(uuid, uuid, integer)
            from public, anon;
          revoke execute on function public.teacher_has_class(uuid)
            from public, anon;
          revoke execute on function public.week_effective_status(uuid)
            from public, anon;
          revoke execute on function public.week_registration_is_open(uuid, uuid)
            from public, anon;
          revoke execute on function public.sync_week_statuses()
            from public, anon, authenticated;
          SQL

          echo "Migration A: $A"
          echo "Migration B: $B"

      - name: Validate migration content
        if: steps.guard.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*_sec_sql_hardening_001_trigger_acl.sql' | wc -l)" -eq 1
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*_sec_sql_hardening_002_anon_helpers.sql' | wc -l)" -eq 1
          ! grep -RniE '(^|[^a-z])(select|insert|update|delete|alter|create|drop|grant)[[:space:]]'             supabase/migrations/*_sec_sql_hardening_001_trigger_acl.sql             supabase/migrations/*_sec_sql_hardening_002_anon_helpers.sql
          grep -c '^revoke execute on function' supabase/migrations/*_sec_sql_hardening_001_trigger_acl.sql | grep -qx '13'
          grep -c '^revoke execute on function' supabase/migrations/*_sec_sql_hardening_002_anon_helpers.sql | grep -qx '15'

      - name: Commit generated migrations
        if: steps.guard.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "chore: record SEC-SQL hardening migrations"
          git push origin HEAD:sec/sql-history-001
