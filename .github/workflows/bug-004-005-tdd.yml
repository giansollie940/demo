name: BUG-004-005 TDD

on:
  push:
    branches:
      - verify/002-rc2-realtime-crossweek
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: BUG-001 regression
        run: npm run test:bug-001
      - name: Static regression
        run: npm run test:static
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build:pages
