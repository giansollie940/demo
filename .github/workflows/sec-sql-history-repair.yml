name: SEC-SQL-HISTORY-001 Repair Remote History

on:
  push:
    branches:
      - sec/sql-history-001

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD_PRIMARY: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_PASSWORD_PRODUCTION: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: qhqqujozpqopahxscpks
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: sec/sql-history-001

      - name: Resolve credentials without printing them
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Missing repository secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          if [ -n "${SUPABASE_DB_PASSWORD_PRIMARY:-}" ]; then
            echo "SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD_PRIMARY}" >> "$GITHUB_ENV"
          elif [ -n "${SUPABASE_DB_PASSWORD_PRODUCTION:-}" ]; then
            echo "SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD_PRODUCTION}" >> "$GITHUB_ENV"
          else
            echo "::error::Missing repository secret SUPABASE_DB_PASSWORD or PRODUCTION_DB_PASSWORD"
            exit 1
          fi

      - name: Install and link Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest --version
          npx --yes supabase@latest link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Pre-repair migration list
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest migration list

      - name: Repair hardening 001 history
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest migration repair 20260924040615 --status applied

      - name: Repair hardening 002 history
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest migration repair 20260924040619 --status applied

      - name: Final migration list
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest migration list
